[project]
name = "lyric-emotion"
version = "0.1.0"
description = "Fine-grained emotion analysis of song lyrics: a fine-tuned ModernBERT model (28 emotions + VAD) evaluated on a hand-annotated gold set, applied to The Cure vs The Smiths."
authors = [
    { name = "Krdo", email = "jcbatman@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.0.1",
    "lyricsgenius>=3.12.2",
    "matplotlib>=3.11.1",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "streamlit>=1.63.0",
    "tenacity>=9.1.4",
    "torch>=2.14.0",
    "tqdm>=4.70.0",
    "transformers>=5.17.0",
    "typer>=0.27.2",
]

[project.scripts]
lyric-emotion = "lyric_emotion:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that hit Hugging Face Hub / GitHub, skip with -m 'not network'"]
