name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies (locked)
        run: uv sync --locked

      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      # Offline tests only; the dashboard smoke test runs against the committed bundle.
      - name: Tests
        run: uv run pytest -m "not network"
